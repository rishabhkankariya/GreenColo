apiVersion: 1

datasources:
  - name: InfluxDB_Flux
    type: influxdb
    access: proxy
    url: http://influxdb:8086
    jsonData:
      version: Flux
      organization: greencolo
      defaultBucket: greencolo_telemetry
      tlsSkipVerify: true
    secureJsonData:
      token: greencolo-super-secret-admin-token-2026
    isDefault: true
    editable: true
